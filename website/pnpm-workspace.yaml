packages:
  - "."

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.110.9'
  - '@supabase/functions-js@2.110.9'
  - '@supabase/postgrest-js@2.110.9'
  - '@supabase/realtime-js@2.110.9'
  - '@supabase/storage-js@2.110.9'
  - '@supabase/supabase-js@2.110.9'

# Patched releases for advisories reported by `pnpm audit` (see
# docs/compliance/01-initial-audit.md, D-I3). Remove once upstream
# postcss and @tailwindcss ship with these versions.
overrides:
  nanoid@<3.3.18: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2
  # Development-tool advisories from the November 2026 security audit
  # (SA-007): brace-expansion, js-yaml, zod and minimatch under ESLint.
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  js-yaml@<4.3.2: ^4.3.2
  zod@>=4.0.0 <4.6.6: ^4.6.6
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
